[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fmva"
version = "1.0.0"
description = "Financial Modeling & Valuation Agent — AI-augmented institutional-grade company valuations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "FMVA Team"},
]
keywords = ["finance", "valuation", "dcf", "financial-modeling", "llm"]

dependencies = [
    "numpy==1.26.3",
    "pandas==2.1.4",
    "scipy==1.12.0",
    "pydantic==2.5.3",
    "openpyxl==3.1.2",
    "xlsxwriter==3.1.9",
    "yfinance==0.2.36",
    "matplotlib==3.8.2",
    "seaborn==0.13.2",
    "plotly==5.18.0",
    "ipywidgets==8.1.2",
    "jinja2==3.1.3",
    "reportlab==4.1.0",
    "loguru==0.7.2",
    "tqdm==4.66.1",
    "python-dateutil>=2.8.0",
    "tenacity==8.2.3",
    "httpx==0.26.0",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
llm = [
    "transformers==4.40.0",
    "peft==0.10.0",
    "trl==0.8.6",
    "bitsandbytes==0.43.0",
    "accelerate==0.28.0",
    "einops==0.7.0",
]
dev = [
    "pytest==7.4.4",
    "pytest-cov==4.1.0",
    "pytest-mock==3.12.0",
    "mypy==1.8.0",
    "black>=23.0",
    "isort>=5.12",
]

[tool.setuptools.packages.find]
include = ["fmva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks integration tests (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = false

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
